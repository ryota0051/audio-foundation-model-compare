# 混同行列の作図（scripts/analysis/confusion_figures.py）
output_dir: outputs/analysis/confusion

esc50:
  dataset_config: configs/dataset/esc50.yaml
  # ゼロショットは Step1 の最良条件（best.json）を使う
  zeroshot_config: configs/experiment/esc50_zeroshot.yaml
  retrieval_config: configs/experiment/esc50_retrieval.yaml
  knn_k: 1
  # k-NN の混同行列を描くモデル（esc50_retrieval.yaml の models のキー）
  knn_models: [EmbeddingGemma2, BEATs_iter3, BEATs_iter3+AS2M_FT]
  # ESC-50 の大分類の表示名。出典は ESC-50 公式 README の表で、列順に並べる
  # （target 番号が大分類ごとに 10 個ずつ連番なので target // 10 で対応づく。詳細: docs/design/evaluation/confusion.md）
  category_groups:
    - Animals
    - Natural / water
    - Human non-speech
    - Interior / domestic
    - Exterior / urban

dcase:
  dataset_config: configs/dataset/dcase.yaml
  # 学習用正常音スコア（leave-one-out）の分位点を閾値にする（公式ベースラインと同じ 90%）
  threshold_quantile: 0.9
  # 全モデル同条件: whole / single / kNN k / dim
  knn_k: 1
  dim: 768
  models:
    EmbeddingGemma2: outputs/cache/dcase
    BEATs_iter3: outputs/cache/dcase_beats/beats_iter3

# 図の配色（dataviz 既定パレットの sequential blue とチャートの地・文字色）
style:
  sequential: ["#fcfcfb", "#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5", "#256abf", "#184f95", "#0d366b"]
  surface: "#fcfcfb"
  text_primary: "#0b0b0b"
  text_secondary: "#52514e"
  muted: "#898781"
  grid: "#e1e0d9"
  series: ["#2a78d6", "#eb6834", "#1baf7a"]
