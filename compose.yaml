services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: egaudio:latest
    working_dir: /workspace
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./src:/workspace/src
      - ./tests:/workspace/tests
      - ./scripts:/workspace/scripts
      - ./configs:/workspace/configs
      - ./data:/workspace/data:ro
      - ./outputs:/workspace/outputs
      - ./.hf_cache:/workspace/.hf_cache
      - ./models:/workspace/models:ro
    # playground アプリ用（`docker compose run --service-ports` のときのみ有効）。ホストの localhost にだけ公開
    ports:
      - "127.0.0.1:7860:7860"
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
