# ブラウザで「テキスト ⇔ マイク音声」の類似度を試すアプリの設定
model_config: configs/model/embeddinggemma2.yaml

server:
  # コンテナ内では 0.0.0.0 で待ち受け、ホスト側は compose.yaml で 127.0.0.1 にのみ公開
  host: 0.0.0.0
  port: 7860

audio:
  # これより長い録音は先頭から打ち切る
  max_sec: 30.0

# テキスト側のプレフィックス（音声には付けない）。最初のものが既定値
# テキスト候補 = 検索される文書、音声 = 問い合わせ、という使い方なので document を既定にする
# （モデル同梱の config_sentence_transformers.json の "document" / "query" プロンプトと同じ文字列）
text_prefixes:
  document: "title: none | text: {text}"
  none: "{text}"
  search: "task: search result | query: {text}"
  classification: "task: classification | query: {text}"

# 起動時にテキスト欄へ入れておく例文（1 行 1 候補）。社内ナレッジを音声で引く想定
default_texts:
  - 明日の経営会議は10時から本社の大会議室で行う
  - 有給休暇の申請は勤怠システムから行う
  - 案件BのPMはAさん
  - 経費精算の締め切りは毎月25日
  - 出張の宿泊費の上限は1泊1万2千円
  - 社内Wi-Fiのパスワードは情報システム部に問い合わせる
  - 新入社員研修は4月の第1週に実施する
  - 会議室の予約はグループウェアのカレンダーから行う
  - 請求書の発行は経理部の山田さんが担当
  - リモートワークは週3日まで認められている
