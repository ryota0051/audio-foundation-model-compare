[project]
name = "egaudio"
version = "0.1.0"
description = "EmbeddingGemma 2 audio embeddings for zero-shot classification and anomalous sound detection"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.7",
    "torchvision",
    "torchaudio",
    "transformers>=5.0",
    "sentence-transformers[image]>=5.0",
    "numpy",
    "scipy",
    "soundfile",
    "soxr",
    "scikit-learn",
    "pandas",
    "pyyaml",
    "tqdm",
]

[dependency-groups]
dev = ["pytest>=8", "matplotlib", "umap-learn"]
app = ["gradio>=5"]

[tool.uv]
default-groups = ["dev", "app"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/egaudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
